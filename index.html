<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 30px; font-size: 24px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-musee { background-color: #2980b9; }
        .btn-musee:hover { background-color: #21618c; }
        .btn-resto { background-color: #b57e2f; }
        .btn-resto:hover { background-color: #9c6b24; }
    </style>
</head>
<body>

<div class="menu-container">
    <h1>Choix du Service</h1>
    <a href="musee.html" class="btn btn-musee">🎟️ Billet Musée</a>
    <a href="restaurant.html" class="btn btn-resto">🍽️ Billet Restaurant</a>
</div>

</body>
</html>
