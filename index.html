<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billet d'Entrée - Musée Star Wars</title>
<style>
  /* إعدادات خاصة بمقاس 58mm */
  @page {
    margin: 0;
    size: 58mm auto; 
  }

  body { 
    font-family: 'Segoe UI', Arial, sans-serif; 
    background: #f4f4f4; 
    padding: 10px; 
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .ticket {
    width: 58mm; 
    background: #fff; 
    border: 1px dashed #999;
    padding: 3mm 2mm; 
    box-sizing: border-box;
    font-size: 14px; /* خط أكبر */
    color: #000;
  }

  .header { 
    text-align: center; 
    border-bottom: 1px dashed #000; 
    padding-bottom: 3mm; 
    margin-bottom: 3mm; 
  }
  .header h1 { margin: 0 0 2mm 0; color: #000; font-size: 18px; font-weight: bold;}
  .header h2 { margin: 1mm 0; color: #000; font-size: 14px; font-weight: normal;}
  .header p { margin: 1mm 0; font-size: 12px; color: #000; font-weight: bold;}
  
  .row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    margin: 2.5mm 0; 
    font-size: 14px; 
    font-weight: bold;
  }
  .row label { width: 45%; }
  .row input[type="text"] { 
    width: 50%; 
    border: none; 
    border-bottom: 1px solid #000; 
    padding: 1mm; 
    font-size: 14px; 
    text-align: left; 
    background: transparent; 
    font-weight: bold;
  }
  .row input[type="text"]:focus { outline: none; }
  .row span.val { font-size: 15px; }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    margin: 3mm 0; 
  }
  th, td { 
    border: 1px solid #000; 
    padding: 2mm; 
    text-align: center; 
    font-size: 13px; 
    font-weight: bold;
  }
  th { background: #eee; color: #000; }
  input[type="number"] { 
    width: 90%; 
    padding: 1mm; 
    text-align: center; 
    font-size: 14px; 
    border: none; 
    background: transparent;
    font-weight: bold;
  }
  .total-cell { font-size: 15px; }

  .footer { 
    margin-top: 4mm; 
    font-size: 13px; 
    color: #000; 
    border-top: 1px dashed #000; 
    padding-top: 3mm; 
    text-align: center;
    font-weight: bold;
  }
  
  .buttons { text-align: center; margin-top: 20px; }
  button { 
    padding: 10px 20px; 
    font-size: 14px; 
    margin: 5px; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    font-weight: bold;
  }
  .btn-print { background: #b00; color: #fff; }
  .btn-new { background: #333; color: #fff; }

  /* إعدادات الطباعة */
  @media print {
    body { background: #fff; padding: 0; display: block; }
    .buttons { display: none; }
    .ticket { 
      border: none; 
      width: 58mm; 
      padding: 0;
      margin: 0;
    }
    input { border: none !important; }
    th { background: #fff !important; border: 1px solid #000; }
  }
</style>
</head>
<body>

<div class="ticket">
  <div class="header">
    <h1>BILLET D'ENTRÉE</h1>
    <h2>Musée Star Wars</h2>
    <p>Hôtel Sidi Idriss</p>
    <p>📞 75 240 005</p>
    <p>✉️ sidi.idris.hotel@gmail.com</p>
  </div>

  <div class="row">
    <label>N° Billet :</label>
    <span class="val" id="numTicket">...</span>
  </div>
  
  <div class="row">
    <label>Date :</label>
    <span class="val" id="dateTicket">...</span>
  </div>

  <div class="row">
    <label>Client / Agence :</label>
    <input type="text" id="client" placeholder="Nom...">
  </div>

  <table>
    <thead>
      <tr>
        <th>Visiteurs</th>
        <th>Prix (DT)</th>
        <th>Total (DT)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="number" id="nbVisiteurs" value="1" min="1" oninput="calculerTotal()"></td>
        <td><input type="number" id="prix" value="0" min="0" step="0.5" oninput="calculerTotal()"></td>
        <td class="total-cell" id="total">0.000</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <p style="font-size: 14px; margin: 2mm 0;">Bienvenue !</p>
    <p style="margin: 1mm 0;">Merci de votre visite.</p>
  </div>
</div>

<div class="buttons">
  <button class="btn-print" onclick="window.print()">🖨️ Imprimer</button>
  <button class="btn-new" onclick="nouvelleTicket()">➕ Nouveau Billet</button>
</div>

<script>
  function getNumero() {
    let n = localStorage.getItem('numTicket_sidiIdris');
    if (!n) { n = 1; localStorage.setItem('numTicket_sidiIdris', 1); }
    return parseInt(n);
  }

  function afficherNumero() {
    let n = getNumero();
    document.getElementById('numTicket').textContent = 'TKT-' + String(n).padStart(3, '0');
  }

  function afficherDate() {
    let d = new Date();
    let jour = String(d.getDate()).padStart(2, '0');
    let mois = String(d.getMonth() + 1).padStart(2, '0');
    let annee = d.getFullYear();
    document.getElementById('dateTicket').textContent = jour + '/' + mois + '/' + annee;
  }

  function calculerTotal() {
    let nb = parseFloat(document.getElementById('nbVisiteurs').value) || 0;
    let prix = parseFloat(document.getElementById('prix').value) || 0;
    document.getElementById('total').textContent = (nb * prix).toFixed(3);
  }

  function nouvelleTicket() {
    let n = getNumero() + 1;
    localStorage.setItem('numTicket_sidiIdris', n);
    afficherNumero();
    afficherDate();
    document.getElementById('client').value = '';
    document.getElementById('nbVisiteurs').value = 1;
    document.getElementById('prix').value = 0;
    document.getElementById('total').textContent = '0.000';
  }

  afficherNumero();
  afficherDate();
</script>

</body>
</html>
