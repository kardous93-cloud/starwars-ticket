<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تذكرة دخول - متحف حرب النجوم</title>
<style>
  /* إعدادات خاصة بمقاس 58mm */
  @page {
    margin: 0;
    size: 58mm auto; /* العرض 58mm والطول أوتوماتيك */
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
    background: #f4f4f4; 
    padding: 20px; 
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .ticket {
    width: 58mm; /* عرض المطبعة الحرارية */
    background: #fff; 
    border: 1px dashed #999;
    padding: 2mm; 
    box-sizing: border-box;
    font-size: 12px;
  }

  .header { 
    text-align: center; 
    border-bottom: 1px dashed #000; 
    padding-bottom: 2mm; 
    margin-bottom: 2mm; 
  }
  .header h1 { margin: 0; color: #000; font-size: 14px; }
  .header h2 { margin: 1mm 0; color: #000; font-size: 11px; font-weight: normal;}
  .header p { margin: 1mm 0; font-size: 10px; color: #000; }
  
  .row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    margin: 1.5mm 0; 
    font-size: 11px; 
  }
  .row label { font-weight: bold; width: 40%; }
  .row input[type="text"] { 
    width: 58%; 
    border: none; 
    border-bottom: 1px dotted #000; 
    padding: 1mm; 
    font-size: 11px; 
    text-align: right; 
    background: transparent; 
  }
  .row input[type="text"]:focus { outline: none; }
  .row span.val { font-weight: bold; font-size: 11px; }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    margin: 2mm 0; 
  }
  th, td { 
    border: 1px solid #000; 
    padding: 1mm; 
    text-align: center; 
    font-size: 11px; 
  }
  th { background: #eee; color: #000; font-weight: bold;}
  input[type="number"] { 
    width: 90%; 
    padding: 1mm; 
    text-align: center; 
    font-size: 11px; 
    border: none; 
    background: transparent;
  }
  .total-cell { font-weight: bold; font-size: 12px; }

  .footer { 
    margin-top: 2mm; 
    font-size: 9px; 
    color: #000; 
    border-top: 1px dashed #000; 
    padding-top: 2mm; 
    text-align: center;
  }
  
  .buttons { text-align: center; margin-top: 20px; }
  button { 
    padding: 10px 20px; 
    font-size: 14px; 
    margin: 5px; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
  }
  .btn-print { background: #b00; color: #fff; }
  .btn-new { background: #333; color: #fff; }

  /* إعدادات الطباعة */
  @media print {
    body { background: #fff; padding: 0; display: block; }
    .buttons { display: none; }
    .ticket { 
      border: none; 
      width: 58mm; 
      padding: 0;
      margin: 0;
    }
    input { border: none !important; }
    th { background: #fff !important; border: 1px solid #000; }
  }
</style>
</head>
<body>

<div class="ticket">
  <div class="header">
    <h1>تذكرة دخول</h1>
    <h2>متحف حرب النجوم</h2>
    <p><strong>نزل سيدي إدريس</strong></p>
    <p>📞 75 240 005</p>
  </div>

  <div class="row">
    <label>رقم التذكرة:</label>
    <span class="val" id="numTicket">...</span>
  </div>
  
  <div class="row">
    <label>التاريخ:</label>
    <span class="val" id="dateTicket">...</span>
  </div>

  <div class="row">
    <label>الحريف:</label>
    <input type="text" id="client" placeholder="الاسم...">
  </div>

  <table>
    <thead>
      <tr>
        <th>زوار</th>
        <th>سعر</th>
        <th>المجموع</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="number" id="nbVisiteurs" value="1" min="1" oninput="calculerTotal()"></td>
        <td><input type="number" id="prix" value="0" min="0" step="0.5" oninput="calculerTotal()"></td>
        <td class="total-cell" id="total">0.000</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <p>صالحة في تاريخ الطبع فقط.</p>
    <p>غير قابلة للاسترجاع.</p>
    <br>
    <p>شكراً لزيارتكم!</p>
  </div>
</div>

<div class="buttons">
  <button class="btn-print" onclick="window.print()">🖨️ طباعة حرارية</button>
  <button class="btn-new" onclick="nouvelleTicket()">➕ تذكرة جديدة</button>
</div>

<script>
  // نفس السكريبت متاع قبل
  function getNumero() {
    let n = localStorage.getItem('numTicket_sidiIdris');
    if (!n) { n = 1; localStorage.setItem('numTicket_sidiIdris', 1); }
    return parseInt(n);
  }

  function afficherNumero() {
    let n = getNumero();
    document.getElementById('numTicket').textContent = 'TKT-' + String(n).padStart(3, '0');
  }

  function afficherDate() {
    let d = new Date();
    let jour = String(d.getDate()).padStart(2, '0');
    let mois = String(d.getMonth() + 1).padStart(2, '0');
    let annee = d.getFullYear();
    document.getElementById('dateTicket').textContent = jour + '/' + mois + '/' + annee;
  }

  function calculerTotal() {
    let nb = parseFloat(document.getElementById('nbVisiteurs').value) || 0;
    let prix = parseFloat(document.getElementById('prix').value) || 0;
    document.getElementById('total').textContent = (nb * prix).toFixed(3);
  }

  function nouvelleTicket() {
    let n = getNumero() + 1;
    localStorage.setItem('numTicket_sidiIdris', n);
    afficherNumero();
    afficherDate();
    document.getElementById('client').value = '';
    document.getElementById('nbVisiteurs').value = 1;
    document.getElementById('prix').value = 0;
    document.getElementById('total').textContent = '0.000';
  }

  afficherNumero();
  afficherDate();
</script>

</body>
</html>
